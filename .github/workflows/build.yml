name: Build Windows Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore BlueIPRouter.sln
      - name: Build
        run: dotnet build BlueIPRouter.sln -c Release --no-restore
      - name: Publish App & Service
        run: |
          dotnet publish src/BlueIPRouter.App/BlueIPRouter.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish/app
          dotnet publish src/BlueIPRouter.Service/BlueIPRouter.Service.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish/app/service
      - name: Package Zip
        shell: pwsh
        run: Compress-Archive -Path publish/app/* -DestinationPath BlueIPRouter-win-x64.zip
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlueIPRouter-win-x64
          path: BlueIPRouter-win-x64.zip
